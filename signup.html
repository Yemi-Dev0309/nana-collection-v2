<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Nana Collection</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f8f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .signup-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .signup-box h2 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 20px;
        }

        .signup-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .signup-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #8B4513;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .signup-box button:hover {
            background: #6d3410;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            color: #8B4513;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h2>Create Account</h2>

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email Address"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
        >

        <button id="signupBtn">Create Account</button>

        <div class="links">
            <p>Already have an account?</p>

            <a href="login.html">Login</a>

            <br><br>

            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
