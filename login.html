<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Nana Collection</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f8f8f8;
    font-family:Arial, Helvetica, sans-serif;
}

.login-box{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.login-box h2{
    text-align:center;
    color:#8B4513;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#8B4513;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.login-box button:hover{
    background:#6d3410;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    text-decoration:none;
    color:#8B4513;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Nana Collection</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<button type="button" id="forgetPasswordBtn">Forget Password?</button>

<div class="links">
<p>Don't have an account?</p>
<a href="signup.html">Create Account</a>

<br><br>

<a href="index.html">← Back to Home</a>

</div>

</div>

<script type="module" src="auth.js"></script>
</body>
</html>
